# Manual agent image for the capture-measurement vCluster deploy.
# Same shape as build-extmem-trial-agent.yaml: the agent image also carries
# the pagebroker binary, and this workflow does not run make check.
name: Build capture measurement agent

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent (includes pagebroker binary)
        run: |
          make docker-build-agent \
            REGISTRY=ghcr.io/${{ github.repository_owner }}/snapshot \
            TAGS=capture-measurement \
            DOCKER_BUILD_ARGS="--platform=linux/amd64 --push \
              --cache-from=type=gha,scope=capture-measurement-agent \
              --cache-to=type=gha,scope=capture-measurement-agent,mode=max"

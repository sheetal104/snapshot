# One-off agent image for CRIU #3119 / extmem capture trial (no full make check).
name: Build extmem trial agent

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent (includes pagebroker binary)
        run: |
          make docker-build-agent \
            REGISTRY=ghcr.io/${{ github.repository_owner }}/snapshot \
            TAGS=extmem-3119-trial \
            DOCKER_BUILD_ARGS="--platform=linux/amd64 --push \
              --cache-from=type=gha,scope=extmem-agent \
              --cache-to=type=gha,scope=extmem-agent,mode=max"

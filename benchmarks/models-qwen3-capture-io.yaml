#
# Capture I/O experiment: the two ends of the measured scale, same runtime
# settings as models-qwen3-scale.yaml. imageIoMode and PageBroker are cluster
# config, not model env, so they are not set here.

models:
  - label: "Qwen3 0.6B"
    hf_id_or_path: "Qwen/Qwen3-0.6B"
    reported_weights_bytes: 1500000000
    env:
      VLLM_MAX_MODEL_LEN: "2048"
      VLLM_GPU_MEMORY_UTILIZATION: "0.50"

  - label: "Qwen3 14B"
    hf_id_or_path: "Qwen/Qwen3-14B"
    reported_weights_bytes: 29500000000
    env:
      VLLM_MAX_MODEL_LEN: "2048"
      VLLM_GPU_MEMORY_UTILIZATION: "0.50"
